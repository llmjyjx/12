<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>澳门赌大小</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
     
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0a0a0f;
            color: #fff;
            margin: 0;
            padding: 15px 10px;
        }
        .game-container {
            max-width: 520px;
            margin: 0 auto;
        }
        .balance-box {
            background: #1f1f2b;
            border: 3px solid #ff2d55;
            border-radius: 16px;
            padding: 14px;
            font-size: 24px;
            font-weight: bold;
            color: #00ff9d;
            text-align: center;
            margin-bottom: 25px;
        }
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
        }
        .die {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow:
                0 15px 35px rgba(0,0,0,0.7),
                inset 0 12px 25px rgba(255,255,255,0.95),
                inset 0 -12px 25px rgba(0,0,0,0.25);
            position: relative;
        }
        .pip {
            position: absolute;
            background: #111;
            border-radius: 50%;
            width: 22px;
            height: 22px;
        }
        .pip.red {
            background: #ff2d55;
        }
        /* 1点 */
        .die.one .pip {
            width: 36px;
            height: 36px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* 2点 */
        .die.two .pip:nth-child(1) { top: 30%; left: 30%; }
        .die.two .pip:nth-child(2) { top: 63%; left: 63%; }
        /* 3点 */
        .die.three .pip:nth-child(1) { top: 23%; left: 23%; }
        .die.three .pip:nth-child(2) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .die.three .pip:nth-child(3) { top: 70%; left: 70%; }
        /* 4点 */
        .die.four .pip:nth-child(1) { top: 28%; left: 28%; }
        .die.four .pip:nth-child(2) { top: 28%; left: 63%; }
        .die.four .pip:nth-child(3) { top: 63%; left: 28%; }
        .die.four .pip:nth-child(4) { top: 63%; left: 63%; }
        /* 5点 */
        .die.five .pip:nth-child(1) { top: 23%; left: 23%; }
        .die.five .pip:nth-child(2) { top: 23%; left: 68%; }
        .die.five .pip:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .die.five .pip:nth-child(4) { top: 68%; left: 23%; }
        .die.five .pip:nth-child(5) { top: 68%; left: 68%; }
        /* 6点 */
        .die.six .pip:nth-child(1) { top: 23%; left: 28%; }
        .die.six .pip:nth-child(2) { top: 23%; left: 63%; }
        .die.six .pip:nth-child(3) { top: 50%; left: 28%; }
        .die.six .pip:nth-child(4) { top: 50%; left: 63%; }
        .die.six .pip:nth-child(5) { top: 70%; left: 28%; }
        .die.six .pip:nth-child(6) { top: 70%; left: 63%; }
        .rolling {
            animation: diceRoll 2.3s linear infinite;
        }
        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(1620deg) scale(1); }
        }
        .bet-buttons {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .bet-side {
            flex: 1;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
        }
        .big-btn { background: #ff2d55; }
        .small-btn { background: #3b82f6; }
        .btn-selected {
            box-shadow: 0 0 0 5px rgba(255, 215, 0, 0.9) !important;
            transform: scale(1.05);
        }
        .roll-btn {
            background: #ffd700;
            color: #111;
            font-size: 20px;
            font-weight: bold;
            padding: 17px;
            border: none;
            border-radius: 14px;
            width: 100%;
            margin: 15px 0 25px;
            height: 64px;
        }
        .roll-btn:disabled {
            background: #555;
            color: #aaa;
        }
        .control-box {
            background: #1a1a24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .suggest {
            background: #111118;
            border: 3px solid #ffd700;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 18px;
        }
        .bet-amount {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .bet-input {
            flex: 1;
            padding: 16px;
            font-size: 21px;
            text-align: center;
            border: 3px solid #ffd700;
            border-radius: 14px;
            background: #222;
            color: white;
        }
        .adjust-btn {
            background: #444;
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            font-size: 24px;
            border-radius: 12px;
        }
        .result {
            min-height: 85px;
            font-size: 22px;
            text-align: center;
            margin: 10px 0;
        }

        /* 新增密码样式 */
        #password-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        .password-box {
            background: #1f1f2b;
            padding: 40px 30px;
            border-radius: 20px;
            border: 3px solid #ffd700;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .password-box h2 {
            margin: 0 0 20px 0;
            color: #ffd700;
        }
        #passwordInput {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            text-align: center;
            border: 3px solid #ffd700;
            border-radius: 12px;
            background: #111;
            color: white;
            margin-bottom: 15px;
        }
        #submitPassword {
            background: #ffd700;
            color: #111;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 密码界面 -->
    <div id="password-screen">
        <div class="password-box">
            <h2>🔒 请输入密码</h2>
            <input type="password" id="passwordInput" placeholder="****">
            <button id="submitPassword">确认进入</button>
            <p style="margin-top:15px; font-size:14px; color:#888;">输入错误将无法游玩</p>
        </div>
    </div>

    <div class="game-container" id="gameContainer" style="display: none;">
        <div class="balance-box">
            余额: <span id="balance">1000</span> 元
        </div>
        <div class="dice-area">
            <div class="die one" id="die1"><div class="pip red"></div></div>
            <div class="die two" id="die2"><div class="pip"></div><div class="pip"></div></div>
        </div>
        <div class="control-box">
            <div class="bet-buttons">
                <div class="bet-side big-btn" id="bigBtn" onclick="placeBet('big')">大</div>
                <div class="bet-side small-btn" id="smallBtn" onclick="placeBet('small')">小</div>
            </div>
            <div class="suggest" id="suggestBox">
                建议投注: <span id="suggestedBet">300</span> 元
            </div>
            <div class="bet-amount">
                <button class="adjust-btn" onclick="adjustBet(-50)">−</button>
                <input type="number" id="betAmount" class="bet-input" value="300" min="50" step="50">
                <button class="adjust-btn" onclick="adjustBet(50)">+</button>
            </div>
            <button class="roll-btn" id="rollBtn" onclick="rollDice()" disabled>
                押大押小 买定离手
            </button>
            <div class="result" id="result"></div>
        </div>
        <h3 style="color:#ffd700; text-align:center; margin:15px 0;">历史记录</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>局数</th>
                    <th>投注</th>
                    <th>大小</th>
                    <th>点数</th>
                    <th>结果</th>
                    <th>盈亏</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <script>
        // ==================== 密码验证 ====================
        const defaultPassword = "ps";
        let isAuthenticated = false;

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            if (input === defaultPassword) {
                isAuthenticated = true;
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'block';
                // 初始化游戏
                initGame();
            } else {
                alert("❌ 密码错误！无法进入游戏。");
                // 可选：清空输入框
                document.getElementById('passwordInput').value = '';
            }
        }

        // 绑定密码按钮事件
        document.getElementById('submitPassword').addEventListener('click', checkPassword);
        
        // 支持回车键提交密码
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // ==================== 原有游戏逻辑 ====================
        let balance = 1000;
        let currentBet = 0;
        let betType = null;
        let round = 0;
        let consecutiveLosses = 0;

        const balanceEl = document.getElementById('balance');
        const resultEl = document.getElementById('result');
        const suggestedEl = document.getElementById('suggestedBet');
        const bigBtn = document.getElementById('bigBtn');
        const smallBtn = document.getElementById('smallBtn');
        const rollBtn = document.getElementById('rollBtn');
        const betInput = document.getElementById('betAmount');
        const historyBody = document.getElementById('historyBody');

        function initGame() {
            updateBalance();
            updateSuggestedBet();
        }

        function updateBalance() {
            balanceEl.textContent = Math.floor(balance);
        }

        function updateSuggestedBet() {
            const profit = balance - 1000;
            let suggested = 300;
            if (profit > 0) suggested = Math.max(100, Math.floor(profit / 2 / 50) * 50);
            suggestedEl.textContent = suggested;
        }

        function highlightBet(type) {
            bigBtn.classList.remove('btn-selected');
            smallBtn.classList.remove('btn-selected');
            if (type === 'big') bigBtn.classList.add('btn-selected');
            else smallBtn.classList.add('btn-selected');
        }

        function adjustBet(delta) {
            let val = parseInt(betInput.value) || 50;
            betInput.value = Math.max(50, val + delta);
        }

        function placeBet(type) {
            if (!isAuthenticated) return;
            let amount = parseInt(betInput.value);
            if (amount > balance) return alert("余额不足！");
            if (balance < 1000 && !confirm("已亏损本金，确定继续？")) return;
            currentBet = amount;
            betType = type;
            rollBtn.disabled = false;
            rollBtn.textContent = "开始";
            highlightBet(type);
        }

        function rollDice() {
            if (!isAuthenticated || !betType) return;
            rollBtn.disabled = true;
            resultEl.innerHTML = '🎲 摇骰中...';
            const die1 = document.getElementById('die1');
            const die2 = document.getElementById('die2');
            die1.classList.add('rolling');
            die2.classList.add('rolling');
            let interval = setInterval(() => {
                updateDie(die1);
                updateDie(die2);
            }, 90);
            setTimeout(() => {
                clearInterval(interval);
                die1.classList.remove('rolling');
                die2.classList.remove('rolling');
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const total = d1 + d2;
                const isBig = total >= 7;
                const won = (betType === 'big' && isBig) || (betType === 'small' && !isBig);
                setDieFace(die1, d1);
                setDieFace(die2, d2);
                const profit = won ? currentBet : -currentBet;
                balance += profit;
                updateBalance();
                round++;
                if (won) consecutiveLosses = 0;
                else consecutiveLosses++;
                let msg = `第${round}局　${d1}+${d2}=${total}（${isBig?'大':'小'}）<br>`;
                msg += won ?
                    `<span style="color:#00ff9d">🎉 获胜 +${profit} 元</span>` :
                    `<span style="color:#ff2d55">😢 输掉 ${profit} 元</span>`;
                if (consecutiveLosses >= 2) msg += `<br><span style="color:#ff2d55">⚠️ 连续输2次，建议停止</span>`;
                if (balance < 1000) msg += `<br><span style="color:#ff2d55">已亏损本金</span>`;
                resultEl.innerHTML = msg;
                const row = document.createElement('tr');
                row.className = won ? 'win-row' : 'lose-row';
                row.innerHTML = `
                    <td>${round}</td>
                    <td>${currentBet}</td>
                    <td>${betType==='big'?'大':'小'}</td>
                    <td>${total}</td>
                    <td>${won?'✅':'❌'}</td>
                    <td style="color:${won?'#00ff9d':'#ff2d55'}">${profit>0?'+':''}${profit}</td>
                `;
                historyBody.appendChild(row);
                currentBet = 0;
                betType = null;
                bigBtn.classList.remove('btn-selected');
                smallBtn.classList.remove('btn-selected');
                rollBtn.disabled = true;
                rollBtn.textContent = "押大押小 买定离手";
                updateSuggestedBet();
            }, 2400);
        }

        function updateDie(die) {
            const num = Math.floor(Math.random() * 6) + 1;
            setDieFace(die, num);
        }

        function setDieFace(die, num) {
            die.className = `die ${['one','two','three','four','five','six'][num-1]}`;
            die.innerHTML = '';
            const count = num;
            for (let i = 0; i < count; i++) {
                const pip = document.createElement('div');
                pip.className = 'pip';
                if (num === 1 || num === 4) pip.classList.add('red');
                die.appendChild(pip);
            }
        }

        // 页面加载时只显示密码界面
    </script>
</body>
</html>
